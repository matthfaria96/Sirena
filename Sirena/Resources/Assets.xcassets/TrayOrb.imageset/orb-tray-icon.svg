<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
  <defs>
    <clipPath id="disc"><circle cx="12" cy="12" r="10.2"/></clipPath>
    <mask id="cut">
      <rect width="24" height="24" fill="#fff"/>
      <!-- reflexo do vidro -->
      <path d="M5.2 7.8 C6.2 5.4 8.4 3.8 11 3.4" stroke="#000" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <!-- fresta curva entre as camadas da base -->
      <path d="M1 12.4 C4.4 16.6 8.4 12.2 12 14.8 C15.4 17.2 19 12.2 23 13.2" stroke="#000" stroke-width=".7" stroke-linecap="round" fill="none"/>
    </mask>
  </defs>

  <g mask="url(#cut)" fill="#000">
    <!-- Vidro -->
    <circle cx="12" cy="12" r="10.2" opacity=".2"/>
    <!-- Aro -->
    <circle cx="12" cy="12" r="10.2" fill="none" stroke="#000" stroke-width="1.1"/>

    <!-- Redemoinho -->
    <path d="M5.4 10.4 C6.0 5.4 12.0 4.2 14.4 7.4 C16.0 9.6 14.6 12.2 12.2 12.0 C13.8 11.0 13.6 8.8 12.0 8.0 C9.6 6.8 6.6 8.2 5.4 10.4 Z"/>
    <path opacity=".55" d="M12.2 12.0 C15.4 12.2 18.4 10.2 18.6 6.2 C20.0 9.0 18.4 13.2 12.2 12.0 Z"/>

    <!-- Base em ondas: camada translúcida + camada sólida grossa -->
    <g clip-path="url(#disc)">
      <path opacity=".55" d="M0 10.6 C3.8 14.6 8 10.2 12 12.8 C15.6 15.2 19.2 10 24 11.2 L24 24 L0 24 Z"/>
      <path d="M0 12.4 C4.4 16.6 8.4 12.2 12 14.8 C15.4 17.2 19 12.2 24 13.2 L24 24 L0 24 Z"/>
    </g>
  </g>
</svg>
